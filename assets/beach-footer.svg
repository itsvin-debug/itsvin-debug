<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="auto">
  <defs>
    <!-- Night Ocean Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16122e" />
      <stop offset="45%" stop-color="#110d24" />
      <stop offset="85%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Deep Water Gradient -->
    <linearGradient id="nightWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f183d" />
      <stop offset="60%" stop-color="#151229" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Moon Glow Filter -->
    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>

  <style>
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }
    @keyframes nightWaveSlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-18px) translateY(1px); }
      100% { transform: translateX(0); }
    }
    @keyframes foamShimmer {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }

    .night-star { animation: starTwinkle 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .star-delay-1 { animation-delay: 1.2s; }
    .star-delay-2 { animation-delay: 2.3s; }

    .night-wave-back { animation: nightWaveSlow 7s ease-in-out infinite; }
    .night-wave-front { animation: nightWaveSlow 5s ease-in-out infinite reverse; }
    .foam { animation: foamShimmer 3.2s ease-in-out infinite; }
  </style>

  <!-- 1. Background -->
  <rect width="900" height="110" fill="url(#nightSky)" />

  <!-- 2. Distant Night Stars -->
  <g fill="#ffffff">
    <circle cx="95" cy="22" r="1.1" class="night-star" opacity="0.6" />
    <circle cx="210" cy="35" r="1.3" class="night-star star-delay-1" opacity="0.75" />
    <circle cx="340" cy="18" r="1.0" class="night-star star-delay-2" opacity="0.5" />
    <circle cx="560" cy="28" r="1.2" class="night-star star-delay-1" opacity="0.65" />
    <circle cx="680" cy="16" r="1.4" class="night-star star-delay-2" opacity="0.8" />
    <circle cx="810" cy="32" r="1.1" class="night-star" opacity="0.6" />
  </g>

  <!-- 3. Crescent Moon -->
  <g transform="translate(760, 20)">
    <!-- Moon Glow -->
    <circle cx="12" cy="12" r="11" fill="#ffeaa7" opacity="0.25" filter="url(#moonGlow)" />
    <!-- Moon Body -->
    <path fill="#fff7d6" d="M12,2 A10,10 0 1,0 22,16 A12,12 0 0,1 12,2 Z" />
  </g>

  <!-- 4. Moonlight Shimmer on Calm Ocean -->
  <g class="foam" opacity="0.6">
    <ellipse cx="766" cy="52" rx="18" ry="1.4" fill="#dfe6e9" />
    <ellipse cx="764" cy="62" rx="28" ry="1.8" fill="#dfe6e9" />
    <ellipse cx="767" cy="74" rx="22" ry="1.6" fill="#ffeaa7" />
  </g>

  <!-- 5. Calm Rolling Night Waves -->
  <!-- Layer 1: Mid Depth Wave -->
  <path class="night-wave-back" fill="url(#nightWater)" opacity="0.75"
        d="M-20,48 Q180,36 380,45 T780,40 T920,46 L920,110 L-20,110 Z" />

  <!-- Layer 2: Shore Surf Wave -->
  <path class="night-wave-front" fill="#0d1117"
        d="M-20,68 Q160,54 360,65 T760,58 T920,66 L920,110 L-20,110 Z" />

  <!-- Foam Edge Lines -->
  <path class="night-wave-front foam" fill="none" stroke="#74b9ff" stroke-width="2" opacity="0.65" stroke-linecap="round" stroke-dasharray="16 6"
        d="M-20,67 Q160,53 360,64 T760,57 T920,65" />
  <path class="night-wave-back foam" fill="none" stroke="#dfe6e9" stroke-width="1.2" opacity="0.45" stroke-linecap="round" stroke-dasharray="8 4"
        d="M-20,70 Q160,56 360,67 T760,60 T920,68" />
</svg>
