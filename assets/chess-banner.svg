<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 110" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chessBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0b20" />
      <stop offset="45%" stop-color="#181335" />
      <stop offset="85%" stop-color="#29143e" />
      <stop offset="100%" stop-color="#34164b" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaf7b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#181335" stop-opacity="0" />
    </radialGradient>

    <!-- Checkered Pattern -->
    <pattern id="chessboardPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ffffff" fill-opacity="0.025" />
      <rect x="12" y="12" width="12" height="12" fill="#ffffff" fill-opacity="0.025" />
    </pattern>

    <!-- Subtle Drop Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Card Base Background -->
  <rect width="800" height="110" rx="10" ry="10" fill="url(#chessBgGrad)" stroke="#D76D77" stroke-width="2" />

  <!-- 2. Checkered Pattern Overlay -->
  <rect width="800" height="110" rx="10" ry="10" fill="url(#chessboardPattern)" />

  <!-- 3. Ambient Center Glow -->
  <ellipse cx="400" cy="55" rx="260" ry="45" fill="url(#centerAura)" />

  <!-- 4. Left Chess Piece Silhouette (Knight) -->
  <g transform="translate(48, 22) scale(0.68)" fill="#ffaf7b" fill-opacity="0.16">
    <path d="M35,90 L65,90 C65,90 63,80 58,76 C55,73 53,68 53,63 C58,61 66,54 68,46 C70,36 65,30 60,26 C57,23 54,16 48,12 C44,9 38,8 34,10 C32,11 31,14 31,16 C31,20 28,24 24,26 C19,29 14,35 12,42 C10,50 14,56 19,58 C22,60 25,60 26,63 C27,66 26,71 24,76 C20,81 18,90 18,90 Z" />
    <circle cx="28" cy="35" r="2.5" fill="#0e0b20" />
  </g>

  <!-- 5. Right Chess Piece Silhouette (Rook) -->
  <g transform="translate(712, 24) scale(0.68)" fill="#ffaf7b" fill-opacity="0.16">
    <!-- Battlements -->
    <path d="M12,14 L12,25 L18,25 L18,19 L26,19 L26,25 L32,25 L32,19 L40,19 L40,25 L46,25 L46,14 Z" />
    <!-- Tower Body & Base -->
    <path d="M14,27 L44,27 L41,70 L48,76 L48,88 L10,88 L10,76 L17,70 Z" />
  </g>

  <!-- 6. Corner Minimalist Brackets -->
  <g stroke="#ffaf7b" stroke-width="1.2" stroke-opacity="0.3" fill="none">
    <path d="M22,24 L16,24 L16,30" />
    <path d="M778,24 L784,24 L784,30" />
    <path d="M16,80 L16,86 L22,86" />
    <path d="M784,80 L784,86 L778,86" />
  </g>

  <!-- 7. Typography Content -->
  <!-- Main Title -->
  <text x="400" y="52"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#FFAF7B"
        letter-spacing="0.4"
        filter="url(#shadowFilter)">
    Play Real-Time Chess Arena (Click Here)
  </text>

  <!-- Subtitle -->
  <text x="400" y="77"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="13"
        font-weight="500"
        fill="#E2E8F0"
        opacity="0.88"
        letter-spacing="0.3">
    Human vs AI Bot • Live Match • Interactive Board
  </text>
</svg>
